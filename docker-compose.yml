services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080\n      TERRAGUARD_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      - ./backend/app/ml/artifacts:/app/app/ml/artifacts
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "8080:80"
    depends_on:
      - backend
